<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found · Àdùkẹ́ Modern Nigerian Gastronomy</title>
    <meta http-equiv="refresh" content="3; url=./" />
    <style>
      :root {
        --color-emerald: #14532D;
        --color-terracotta: #C2410C;
        --color-canvas: #FAFAF7;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--color-canvas);
        color: #1c1917;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(20, 83, 45, 0.12);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 30px -10px rgba(20, 83, 45, 0.1);
      }
      .tag {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 700;
        color: var(--color-terracotta);
        margin-bottom: 0.75rem;
        display: block;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--color-emerald);
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #57534e;
        margin-bottom: 1.75rem;
      }
      a.btn {
        display: inline-block;
        background-color: var(--color-emerald);
        color: #ffffff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
      a.btn:hover {
        background-color: #0f3d21;
      }
      a.btn:active {
        transform: scale(0.98);
      }
      .redirect-hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">404 · Table Not Found</span>
      <h1>Page Not Found</h1>
      <p>The table you are looking for does not exist or has moved. Returning you to the Àdùkẹ́ dining room.</p>
      <a href="./" class="btn">Return to Dining Room</a>
      <div class="redirect-hint">Redirecting automatically in 3 seconds...</div>
    </main>
  </body>
</html>
