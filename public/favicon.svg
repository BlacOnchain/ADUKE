  <!-- Inner Hearth Core & Golden Spark -->
  <path d="M64 48 C54 62 48 72 48 84 C48 94 55 100 64 100 C73 100 80 94 80 84 C80 72 74 62 64 48 Z" fill="url(#brassGrad)" />
  
  <!-- Hearth Center Ember -->
  <circle cx="64" cy="86" r="6" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Traditional Accent Dot -->
  <circle cx="64" cy="18" r="3" fill="#FCD34D" />
